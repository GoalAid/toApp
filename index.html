<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#17324d">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Hotel Room Manager">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="apple-touch-icon" href="./icons/icon-192.svg">
  <title>Hotel Room Manager</title>
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: #172033;
      background: #f4f6fa;
    }

    header {
      padding: 22px 18px;
      color: white;
      background: #17324d;
    }

    header h1 { margin: 0; font-size: 1.35rem; }
    header p { margin: 5px 0 0; color: #c5d6e8; font-size: .9rem; }

    main {
      width: min(100%, 760px);
      margin: 0 auto;
      padding: 18px 16px 40px;
    }

    .summary {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
      margin-bottom: 20px;
    }

    .summary-card, .panel, .room-card {
      border: 1px solid #e2e7ef;
      border-radius: 14px;
      background: white;
      box-shadow: 0 3px 12px #1720330a;
    }

    .summary-card { padding: 15px; }
    .summary-card span { display: block; color: #697586; font-size: .82rem; }
    .summary-card strong { display: block; margin-top: 5px; font-size: 1.55rem; }

    .panel { padding: 16px; margin-bottom: 18px; }
    .panel h2, .section-heading h2 { margin: 0; font-size: 1.1rem; }

    form {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-top: 14px;
    }

    label { display: grid; gap: 5px; color: #566174; font-size: .82rem; }
    input, select, button {
      min-height: 44px;
      border: 1px solid #d6dce5;
      border-radius: 9px;
      padding: 10px 12px;
      font: inherit;
    }

    input, select { width: 100%; background: white; color: #172033; }
    button { cursor: pointer; font-weight: 650; }
    button:active { transform: scale(.98); }

    .add-button {
      grid-column: 1 / -1;
      border: 0;
      color: white;
      background: #245d88;
    }

    .section-heading {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      margin: 22px 0 12px;
    }

    .section-heading select { width: auto; min-width: 145px; }

    .room-list { display: grid; gap: 11px; }
    .room-card { padding: 15px; }

    .room-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
    }

    .room-top h3 { margin: 0; font-size: 1rem; }
    .room-type, .guest { margin: 8px 0 0; color: #697586; font-size: .9rem; }

    .badge {
      padding: 5px 9px;
      border-radius: 99px;
      font-size: .73rem;
      font-weight: 700;
      text-transform: capitalize;
      white-space: nowrap;
    }

    .badge.available { color: #16734a; background: #e5f6ed; }
    .badge.occupied { color: #a35412; background: #fff0df; }
    .badge.cleaning { color: #315ca8; background: #e8efff; }

    .room-actions { display: flex; gap: 8px; margin-top: 13px; }
    .room-actions button { flex: 1; background: white; }
    .room-actions .primary { color: white; border-color: #245d88; background: #245d88; }
    .room-actions .danger { color: #a53c3c; border-color: #edd4d4; }

    .empty {
      padding: 28px 16px;
      color: #697586;
      text-align: center;
      border: 1px dashed #ccd4df;
      border-radius: 12px;
    }

    @media (min-width: 600px) {
      .summary { grid-template-columns: repeat(4, 1fr); }
      .room-list { grid-template-columns: repeat(2, 1fr); }
    }

    @media (max-width: 360px) {
      form { grid-template-columns: 1fr; }
      .add-button { grid-column: auto; }
      .section-heading { align-items: flex-start; flex-direction: column; }
      .section-heading select { width: 100%; }
    }
  </style>
</head>
<body>
  <header>
    <div id="pwaControls" style="padding:10px 16px; display:flex; gap:10px; align-items:center; justify-content:flex-end; max-width:760px; margin:0 auto;"> <button id="installBtn" style="display:none;padding:8px 12px;border-radius:8px;border:0;background:#245d88;color:#fff;cursor:pointer;">Install</button> <span id="swStatus" style="font-size:.9rem;color:#566174">SW: unknown</span> <button id="swRegisterBtn" style="padding:6px 10px;border-radius:8px;border:1px solid #d6dce5;background:#fff;cursor:pointer;">Register SW</button> </div>
    <h1>Harbor Hotel</h1>
    <p>Room management</p>
  </header>

  <main>
    <section class="summary" aria-label="Room summary">
      <article class="summary-card"><span>Total rooms</span><strong id="totalCount">0</strong></article>
      <article class="summary-card"><span>Available</span><strong id="availableCount">0</strong></article>
      <article class="summary-card"><span>Occupied</span><strong id="occupiedCount">0</strong></article>
      <article class="summary-card"><span>Needs cleaning</span><strong id="cleaningCount">0</strong></article>
    </section>

    <section class="panel">
      <h2>Add a room</h2>
      <form id="addRoomForm">
        <label>
          Room number
          <input id="roomNumber" name="roomNumber" placeholder="e.g. 104" required maxlength="10">
        </label>
        <label>
          Room type
          <select id="roomType" name="roomType">
            <option>Single</option>
            <option>Double</option>
            <option>Twin</option>
            <option>Suite</option>
            <option>Family</option>
          </select>
        </label>
        <button class="add-button" type="submit">Add room</button>
      </form>
    </section>

    <section>
      <div class="section-heading">
        <h2>Rooms</h2>
        <select id="filter" aria-label="Filter rooms">
          <option value="all">All rooms</option>
          <option value="available">Available</option>
          <option value="occupied">Occupied</option>
          <option value="cleaning">Needs cleaning</option>
        </select>
      </div>
      <div class="room-list" id="roomList"></div>
    </section>
  </main>

  <script>
  const defaultRooms = [
    { number: "101", type: "Single", status: "available", guest: "" },
    { number: "102", type: "Double", status: "occupied", guest: "Jordan Lee" },
    { number: "103", type: "Suite", status: "cleaning", guest: "" },
    { number: "201", type: "Double", status: "available", guest: "" }
  ];

  function loadRooms() {
    try {
      const saved = localStorage.getItem("hotelRooms");
      return saved ? JSON.parse(saved) : defaultRooms;
    } catch {
      return defaultRooms;
    }
  }

  let rooms = loadRooms();
  const roomList = document.getElementById("roomList");
  const filter = document.getElementById("filter");

  function saveRooms() {
    localStorage.setItem("hotelRooms", JSON.stringify(rooms));
  }

  function escapeHtml(value) {
    return String(value).replace(/[&<>"']/g, char => ({
      "&": "&amp;",
      "<": "&lt;",
      ">": "&gt;",
      '"': "&quot;",
      "'": "&#39;"
    })[char]);
  }

  function render() {
    const status = filter.value;
    const visibleRooms = rooms
      .filter(room => status === "all" || room.status === status)
      .sort((a, b) => a.number.localeCompare(b.number));

    document.getElementById("totalCount").textContent = rooms.length;
    document.getElementById("availableCount").textContent =
      rooms.filter(room => room.status === "available").length;
    document.getElementById("occupiedCount").textContent =
      rooms.filter(room => room.status === "occupied").length;
    document.getElementById("cleaningCount").textContent =
      rooms.filter(room => room.status === "cleaning").length;

    if (visibleRooms.length === 0) {
      roomList.innerHTML = '<div class="empty">No rooms match this filter.</div>';
      return;
    }

    roomList.innerHTML = visibleRooms.map(room => {
      let action = "";

      if (room.status === "available") {
        action = `<button class="primary" data-action="checkin" data-room="${escapeHtml(room.number)}">Check in</button>`;
      } else if (room.status === "occupied") {
        action = `<button class="danger" data-action="checkout" data-room="${escapeHtml(room.number)}">Check out</button>`;
      } else {
        action = `<button class="primary" data-action="clean" data-room="${escapeHtml(room.number)}">Mark clean</button>`;
      }

      return `
        <article class="room-card">
          <div class="room-top">
            <h3>Room ${escapeHtml(room.number)}</h3>
            <span class="badge ${escapeHtml(room.status)}">${escapeHtml(room.status)}</span>
          </div>
          <p class="room-type">${escapeHtml(room.type)} room</p>
          <p class="guest">${room.guest ? `Guest: ${escapeHtml(room.guest)}` : "No guest assigned"}</p>
          <div class="room-actions">${action}</div>
        </article>
      `;
    }).join("");
  }

  document.getElementById("addRoomForm").addEventListener("submit", event => {
    event.preventDefault();

    const numberInput = document.getElementById("roomNumber");
    const typeInput = document.getElementById("roomType");
    const number = numberInput.value.trim();

    if (!number) {
      alert("Enter a room number.");
      return;
    }

    if (rooms.some(room => room.number.toLowerCase() === number.toLowerCase())) {
      alert("That room number already exists.");
      numberInput.focus();
      return;
    }

    rooms.push({
      number,
      type: typeInput.value,
      status: "available",
      guest: ""
    });

    saveRooms();
    event.target.reset();
    filter.value = "all";
    render();
  });

  roomList.addEventListener("click", event => {
    const button = event.target.closest("button[data-action]");
    if (!button) return;

    const room = rooms.find(item => item.number === button.dataset.room);
    if (!room) return;

    if (button.dataset.action === "checkin") {
      const guest = prompt("Enter the guest's name:");
      if (!guest || !guest.trim()) return;
      room.guest = guest.trim();
      room.status = "occupied";
    } else if (button.dataset.action === "checkout") {
      room.guest = "";
      room.status = "cleaning";
    } else if (button.dataset.action === "clean") {
      room.status = "available";
    }

    saveRooms();
    render();
  });

  filter.addEventListener("change", render);
  render();
</script>
<script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('./sw.js').catch(console.error);
    });
  }
  
/* Service worker registration (attempt on load) */ if ('serviceWorker' in navigator) { window.addEventListener('load', () => { navigator.serviceWorker.register('./sw.js').then(() => { console.log('Service worker registered'); }).catch(err => { console.error('Service worker registration failed:', err); }); }); }

/* PWA UI: beforeinstallprompt + manual register + status */ (() => { const installBtn = document.getElementById('installBtn'); const swStatus = document.getElementById('swStatus'); const swRegisterBtn = document.getElementById('swRegisterBtn');

let deferredPrompt = null; window.addEventListener('beforeinstallprompt', (e) => { e.preventDefault(); deferredPrompt = e; installBtn.style.display = 'inline-block'; installBtn.textContent = 'Install'; console.log('beforeinstallprompt captured'); });

installBtn.addEventListener('click', async () => { if (!deferredPrompt) return; deferredPrompt.prompt(); const choice = await deferredPrompt.userChoice; console.log('PWA install choice:', choice); if (choice.outcome === 'accepted') installBtn.style.display = 'none'; deferredPrompt = null; });

function setSwStatus(text, ok = true) { swStatus.textContent = 'SW: ' + text; swStatus.style.color = ok ? '#16734a' : '#a53c3c'; }

async function updateSwInfo() { if (!('serviceWorker' in navigator)) { setSwStatus('not supported', false); swRegisterBtn.disabled = true; return; } try { const regs = await navigator.serviceWorker.getRegistrations(); if (regs.length > 0 && navigator.serviceWorker.controller) { setSwStatus('active'); } else if (regs.length > 0) { setSwStatus('registered'); } else { setSwStatus('not registered', false); } } catch (err) { setSwStatus('error', false); console.error(err); } }

swRegisterBtn.addEventListener('click', async () => { if (!('serviceWorker' in navigator)) { setSwStatus('not supported', false); return; } try { setSwStatus('registering...'); const reg = await navigator.serviceWorker.register('./sw.js'); console.log('Service worker registered:', reg); setSwStatus('registered'); } catch (err) { console.error('SW register failed', err); setSwStatus('register failed', false); } });

if ('serviceWorker' in navigator) { navigator.serviceWorker.addEventListener('controllerchange', () => { setTimeout(updateSwInfo, 200); }); }

updateSwInfo(); })();
</script>
