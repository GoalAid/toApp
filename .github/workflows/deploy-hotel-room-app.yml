name: Debug hotel-room-app Pages deploy

on:
  workflow_dispatch:

jobs:
  debug:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show repo root
        run: |
          echo "=== pwd ==="
          pwd
          echo "=== ls -la ==="
          ls -la
          echo "=== ls -la hotel-room-app ==="
          ls -la hotel-room-app || true
          echo "=== ls -la hotel-room-app/www ==="
          ls -la hotel-room-app/www || true
          echo "=== git status ==="
          git status --porcelain
          echo "=== git rev-parse HEAD ==="
          git rev-parse HEAD

      - name: Count files to upload
        run: |
          find hotel-room-app/www -type f | wc -l
          find hotel-room-app/www -maxdepth 2 -type f -print | sed -n '1,200p'

      - name: Setup Pages
        uses: actions/configure-pages@v3

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v1
        with:
          path: 'hotel-room-app/www'

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v1
